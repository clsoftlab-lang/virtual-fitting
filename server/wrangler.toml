# Cloudflare Workers 배포 설정 (무료 티어 · 무인 상시 동작).
# 키는 절대 여기에 넣지 마세요. 시크릿으로 주입합니다:
#   wrangler secret put ANTHROPIC_API_KEY

name = "virtual-fitting-ai"
main = "worker.js"
compatibility_date = "2024-09-23"

# 비용/모델 설정(선택). 기본값은 worker.js 안에 내장되어 있습니다.
# 품질을 높이려면 AI_MODEL 을 claude-sonnet-5 또는 claude-opus-5 로.
[vars]
AI_MODEL = "claude-haiku-4-5"
AI_EFFORT = "low"
AI_RATE_LIMIT_PER_MIN = "20"
AI_MONTHLY_TOKEN_CAP = "2000000"
CORS_ORIGIN = "*"

# ANTHROPIC_API_KEY 는 vars 가 아니라 시크릿으로:
#   wrangler secret put ANTHROPIC_API_KEY
